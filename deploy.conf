# Automatic deployment settings for this bot. They ship with the code, so a
# change here is deployed like any other commit. An empty value restores the
# default unless the comment says that it disables the feature.

# Branch whose new commits are deployed.
DEPLOY_BRANCH=main

# Wait for the commit's GitHub checks before deploying: auto, yes, or no.
# "auto" waits when the commit contains .github/workflows and the repository
# is on GitHub. A failed check is never deployed.
REQUIRE_CI=auto

# If no CI result appears within this many minutes (for example, GitHub
# Actions is disabled in a fork), the commit is deployed without CI.
CI_WAIT_MINUTES=30

# Rebuild the running commit on this systemd calendar schedule to pick up
# base-image security fixes. The bot restarts only if the image changed.
# An empty value disables scheduled rebuilds. For a nightly rebuild use
# "*-*-* 03:30:00".
REBUILD_SCHEDULE="*-*-* 03:30:00"

# Optional command run inside the old and the rebuilt image, for bots that
# depend on a fast-moving library. The bot restarts only when its output
# changes. Declare `ARG REBUILD_STAMP` in the Dockerfile right before the step
# that must refresh on every rebuild, for example:
#   ARG REBUILD_STAMP
#   RUN pip install --no-cache-dir --upgrade yt-dlp
# REBUILD_VERSION_CMD="python -m yt_dlp --version"
# This bot rebuilds nightly and restarts only when yt-dlp has a new version.
REBUILD_VERSION_CMD="python -m yt_dlp --version"

# Optional extra check run inside a new image before it replaces the bot.
SMOKE_COMMAND=

# Minutes to keep watching a new release. If it becomes unhealthy or restarts
# during this time, the previous release is restored automatically.
WATCH_MINUTES=10

# Older releases kept for rollback, besides the running one.
KEEP_RELEASES=3
