name: ${APP_SLUG:-videodownloaderbot}

services:
  videodownloaderbot:
    # Deployment builds candidates as :candidate; :local is the running release.
    image: ${APP_SLUG:-videodownloaderbot}:${APP_IMAGE_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Downloads must stay on the bind-mounted VPS filesystem even if an old
      # .env still contains the legacy /tmp workspace.
      OUTPUT_FOLDER: /app/data/downloads
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
